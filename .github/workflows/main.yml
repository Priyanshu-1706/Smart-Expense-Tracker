name: Docker Build, Push and S3

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t smart-expense-tracker:${{ github.run_number }} .

      - name: Push to Docker Hub
        run: |
          docker tag smart-expense-tracker:${{ github.run_number }} \
            priyanshu1706/smart-expense-tracker:v${{ github.run_number }}

          docker push priyanshu1706/smart-expense-tracker:v${{ github.run_number }}

      - name: Save Docker Image
        run: |
          docker save smart-expense-tracker:${{ github.run_number }} \
            -o smart-expense-tracker-v${{ github.run_number }}.tar

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload Image to S3
        run: |
          aws s3 cp smart-expense-tracker-v${{ github.run_number }}.tar \
            s3://priyanshu-devops-s3-practice-2026/docker-images/
